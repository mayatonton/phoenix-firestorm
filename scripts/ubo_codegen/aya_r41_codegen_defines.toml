# AYAstorm r41 UBO Codegen C++ runtime emulation 層 dump file
#
# 位置付け: codegen Python tool が build-time に glslang -E に渡す
#   `-D<key>=<value>` の **静的固定値** dump。AYAstorm shader runtime
#   (`LLGLSLShader::addPermutation()`、`llglslshader.cpp:1754-1757`) が
#   viewer 起動時に inject する dynamic #define のうち、**identifier 値として
#   配列 size 等に直接埋め込まれる macro** (= unresolved だと parse error 直撃) を
#   静的 emulate する。
#
# 起案 = AYAstorm r41 Phase 2.α α-3 improvement 1.5.b (= 2026-06-06)
# 起案契機 = 案 Z (= class*/ + cinematic_bd/ 入力切替) で codegen 単独走行 verify 時に
#   `MAX_JOINTS_PER_MESH_OBJECT` 等が unresolved → parse error 発覚、
#   案 Z' (= 案 Z + C++ runtime emulation 層追加) 確定で本 dump file 起案。
#
# 詳細 source of truth:
#   docs/specs/ayastorm-r41-gl-removal/handoff/phase2/alpha/handoff-phase2-alpha-codegen-single-source-of-truth-entry.md §D.9
#   docs/specs/ayastorm-r41-gl-removal/design/04-codegen-ubo.md §4.5
#   docs/specs/ayastorm-r41-gl-removal/design/06a-cache-structure-and-setter-redirect.md §4.5
#   docs/specs/ayastorm-r41-gl-removal/design/08-build-codegen-pipeline.md §5.0
#
# 動作:
#   1. main.py `--defines-file <path>` option (= improvement 1.5.c) で本 file を読込
#   2. `[defines]` table 内の各 key=value を glslang -E に `-D<key>=<value>` として prepend
#   3. preprocess 完全性確保で actual class*/ + cinematic_bd/ GLSL を parse 成功
#
# CMake DEPENDS 統合:
#   `indra/cmake/AyaUboCodegen.cmake` (= improvement 1.5.d) で本 file を
#   `add_custom_command DEPENDS` に追加、本 file 改訂時 codegen 自動再走行 trigger。
#
# 更新 protocol:
#   - AYAstorm C++ header (= `lljoint.h`、`llviewershadermgr.h` 等) の const 値改訂時、
#     本 file の対応 entry を **手動 sync** 必要
#   - `scripts/ubo_codegen/tests/test_main.py` (= improvement 1.5.c) で sanity check
#   - 値 mismatch が runtime と build-time で起きると codegen 出力 UBO layout が実機と乖離 =
#     SPIR-V validation で検知される (= cold launch validation phase)
#
# 対象範囲 (= 2026-06-06 enumerate 結果、確定値):
#   parse error 直撃 GLSL file = **7 file**
#     - class1/avatar/objectSkinV.glsl
#     - class1/deferred/skinnedVelocityV.glsl
#     - class1/deferred/skinnedVelocityAlphaV.glsl
#     - class1/gltf/pbrmetallicroughnessV.glsl
#     - class1/gltf/pbrmetallicroughnessF.glsl
#     - class3/deferred/multiPointLightF.glsl
#     - class3/deferred/reflectionProbeF.glsl (= `REF_SAMPLE_COUNT` のみ、`MAX_REFMAP_COUNT` は self-define)
#   影響 UBO = **3-5 UBO** (= 80 UBO 中):
#     - PerDrawUBO_ObjectSkin (set=2, binding=0)
#     - PerDrawUBO_SkinnedVelocity (set=2, binding=0、同名 2 file)
#     - PerDrawUBO_MultiLight (set=2, binding=1)
#     - MaterialUBO (= gltf 系) ※ GLTF material declaration は legacy uniform 直 use の可能性、UBO 化対象判定別途
#
# dump 不要 macro (= GLSL 内 self-define で codegen parser からも resolve 可能):
#   - MAX_REFMAP_COUNT (= class3/deferred/reflectionProbeF.glsl:94 `#define MAX_REFMAP_COUNT 256`)
#   - NUM_DIRECTIONS (= class1/deferred/aoUtil.glsl:76 `const int NUM_DIRECTIONS = 8;`)
#
# 編集規律:
#   - 各 entry に source 出典 + rationale を comment で必須記載 (= memory `feedback_no_dual_doc_split` 整合)
#   - 値変更時は handoff §D.9 + per-UBO doc cross-ref も同時更新 (= memory feedback_root_cause_no_shortcuts §11 適用)

[defines]

# === MAX_JOINTS_PER_MESH_OBJECT ===
# Source of truth: `indra/llcharacter/lljoint.h:48`
#   `constexpr U32 LL_MAX_JOINTS_PER_MESH_OBJECT = 110;`
# Inject path:
#   `indra/newview/llskinningutil.cpp:90-93` `getMaxJointCount()` →
#   `indra/newview/llviewershadermgr.cpp:870-871` `attribs["MAX_JOINTS_PER_MESH_OBJECT"]`
# Rationale: viewer 内固定値、device 非依存。
# Usage GLSL file:
#   - class1/avatar/objectSkinV.glsl:44,45,49,50,60,92,102 (= UBO `PerDrawUBO_ObjectSkin` + legacy)
#   - class1/deferred/skinnedVelocityV.glsl:82,86 (= UBO `PerDrawUBO_SkinnedVelocity` + legacy)
#   - class1/deferred/skinnedVelocityAlphaV.glsl:111,115 (= UBO `PerDrawUBO_SkinnedVelocity` + legacy)
# 該当 line 例: `mat3x4 matrixPalette[MAX_JOINTS_PER_MESH_OBJECT];`
MAX_JOINTS_PER_MESH_OBJECT = "110"

# === MAX_NODES_PER_GLTF_OBJECT ===
# Source of truth: `indra/newview/llviewershadermgr.cpp:316-318`
#   `node_size = 16 * 3 = 48`、`max_nodes = gGLManager.mMaxUniformBlockSize / 48`
# Build-time dump: Vulkan minSpec `maxUniformBufferRange = 65536` (= Vulkan 1.0 minimum guaranteed) →
#   `65536 / 48 = 1365`、lower-bound で parse OK 担保
# Runtime inject: device 実値で上書き (= `llviewershadermgr.cpp` 内 addPermutation)
# Rationale: codegen parse 用 = 1365 固定。実機 runtime 値は viewer 起動時 inject で上書き、
#   UBO array max size は実機 device capability に従う。
# Usage GLSL file:
#   - class1/gltf/pbrmetallicroughnessV.glsl:286,337
#   - class1/gltf/pbrmetallicroughnessF.glsl (= gltf 系)
# 該当 line 例: `vec4 gltf_joints[MAX_NODES_PER_GLTF_OBJECT];`
MAX_NODES_PER_GLTF_OBJECT = "1365"

# === MAX_UBO_VEC4S ===
# Source of truth: `indra/newview/llviewershadermgr.cpp:326-327`
#   `max_vec4s = gGLManager.mMaxUniformBlockSize / 16`
# Build-time dump: Vulkan minSpec 65536 / 16 = 4096
# Runtime inject: device 実値で上書き
# Rationale: 同 MAX_NODES_PER_GLTF_OBJECT、Vulkan minSpec lower-bound
# Usage GLSL file:
#   - class1/gltf/pbrmetallicroughnessV.glsl:81
#   - class1/gltf/pbrmetallicroughnessF.glsl:41
# 該当 line 例: `vec4 gltf_material_data[MAX_UBO_VEC4S];`
MAX_UBO_VEC4S = "4096"

# === LIGHT_COUNT ===
# Source of truth: `indra/newview/llviewershadermgr.h:33`
#   `#define LL_DEFERRED_MULTI_LIGHT_COUNT 16`
# Inject path: `indra/newview/llviewershadermgr.cpp:1741-1756` で loop 1..16 で
#   各 `gDeferredMultiLightProgram[i]` に `addPermutation("LIGHT_COUNT", ...)` inject
# Rationale: max instance (= 16 program 最大変種) で固定、parse OK 担保。
#   実 runtime は 1..16 で variant 展開、UBO array max size = 16 で parse 成功。
# Usage GLSL file:
#   - class3/deferred/multiPointLightF.glsl:77,78,86,87,310,311 (= UBO `PerDrawUBO_MultiLight` + legacy)
# 該当 line 例: `vec4 light[LIGHT_COUNT];`
LIGHT_COUNT = "16"

# === REF_SAMPLE_COUNT ===
# Source of truth: `indra/newview/llviewershadermgr.cpp:910`
#   `attribs["REF_SAMPLE_COUNT"] = "32";`
# Rationale: hardcoded literal "32"、device 非依存
# Usage GLSL file:
#   - class3/deferred/reflectionProbeF.glsl:181
# 該当 line 例: `int probeIndex[REF_SAMPLE_COUNT];`
REF_SAMPLE_COUNT = "32"


